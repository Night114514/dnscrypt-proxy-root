name: Shell tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  updater-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell_kind: [dash, busybox-ash, mksh]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shell test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes busybox-static shellcheck util-linux mksh

      - name: Check shell syntax
        shell: bash
        run: |
          mapfile -t shell_files < <({ git grep -Il '^#!.*sh'; printf '%s\n' customize.sh; } | sort -u)
          test "${#shell_files[@]}" -gt 0
          printf 'Checking %d Shell files with dash\n' "${#shell_files[@]}"
          for file in "${shell_files[@]}"; do
            dash -n "$file"
          done

      - name: Check BusyBox ash syntax
        shell: bash
        run: |
          mapfile -t shell_files < <({ git grep -Il '^#!.*sh'; printf '%s\n' customize.sh; } | sort -u)
          test "${#shell_files[@]}" -gt 0
          printf 'Checking %d Shell files with BusyBox ash\n' "${#shell_files[@]}"
          for file in "${shell_files[@]}"; do
            busybox ash -n "$file"
          done

      - name: Check mksh syntax
        shell: bash
        run: |
          mapfile -t shell_files < <({ git grep -Il '^#!.*sh'; printf '%s\n' customize.sh; } | sort -u)
          for file in "${shell_files[@]}"; do
            mksh -n "$file"
          done

      - name: Run real mksh flock portability tests
        run: sh tests/test-flock-portability.sh

      - name: Run ShellCheck on every Shell file
        shell: bash
        run: |
          mapfile -t shell_files < <({ git grep -Il '^#!.*sh'; printf '%s\n' customize.sh; } | sort -u)
          test "${#shell_files[@]}" -gt 0
          shellcheck --severity=error --shell=sh "${shell_files[@]}"

          # Keep warning/info lint strict on the portable core and test harness.
          # SC2016 is intentional where tests assert literal shell source, and
          # SC2329 is intentional for functions invoked indirectly by traps.
          shellcheck --exclude=SC2016,SC2329 --shell=sh \
            scripts/common.sh \
            scripts/update-dnscrypt.sh \
            tests/test-dnscrypt-control.sh \
            tests/test-update-dnscrypt.sh \
            tests/test-flock-portability.sh \
            tests/mocks/busybox \
            tests/mocks/busybox-ash-prelude \
            tests/mocks/date \
            tests/mocks/dnscrypt-control-busybox \
            tests/mocks/dnscrypt-control-chmod \
            tests/mocks/dnscrypt-control-chown \
            tests/mocks/dnscrypt-control-daemon \
            tests/mocks/dnscrypt-control-firewall \
            tests/mocks/dnscrypt-control-nslookup \
            tests/mocks/dnscrypt-control-readlink \
            tests/mocks/dnscrypt-control-settings \
            tests/mocks/dnscrypt-control-stat \
            tests/mocks/dnscrypt-control-su \
            tests/mocks/dnscrypt-control-sysctl \
            tests/mocks/dnscrypt-control-updater \
            tests/mocks/download \
            tests/mocks/getprop \
            tests/mocks/kill \
            tests/mocks/mktemp \
            tests/mocks/mv \
            tests/mocks/notify \
            tests/mocks/sha256sum \
            tests/mocks/uname \
            tests/mocks/unzip

      - name: Check every JavaScript file
        shell: bash
        run: |
          mapfile -d '' js_files < <(git ls-files -z -- '*.js')
          test "${#js_files[@]}" -gt 0
          printf 'Checking %d JavaScript files with Node.js\n' "${#js_files[@]}"
          for file in "${js_files[@]}"; do
            node --check "$file"
          done

      - name: Prepare real resolver preset test inputs
        if: matrix.shell_kind == 'dash'
        run: |
          resolver_ref=$(git ls-remote --exit-code https://github.com/DNSCrypt/dnscrypt-resolvers.git refs/heads/master)
          resolver_sha=$(node -e 'const m = /^([0-9a-f]{40})\trefs\/heads\/master$/.exec(process.argv[1]); if (!m) process.exit(1); process.stdout.write(m[1]);' "$resolver_ref")
          printf 'Resolver snapshot: %s\n' "$resolver_sha"
          preset_dir=$(mktemp -d "$RUNNER_TEMP/resolver-presets.XXXXXX")
          curl --fail --location --retry 2 --max-time 60 \
            https://github.com/DNSCrypt/dnscrypt-proxy/releases/download/2.1.18/dnscrypt-proxy-linux_x86_64-2.1.18.tar.gz \
            --output "$preset_dir/proxy.tar.gz"
          printf '%s  %s\n' c8c8acb35b0f6619bfe8e4eed0c192672f8fd1964f467a42881905814e261c3e "$preset_dir/proxy.tar.gz" | sha256sum --check -
          tar -xzf "$preset_dir/proxy.tar.gz" -C "$preset_dir"
          mkdir "$preset_dir/cache"
          for name in public-resolvers relays odoh-servers odoh-relays; do
            for suffix in md md.minisig; do
              curl --fail --location --retry 2 --max-time 60 \
                "https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/$resolver_sha/v3/$name.$suffix" \
                --output "$preset_dir/cache/$name.$suffix"
            done
          done
          # The real proxy verifies these cache signatures during -check/-list.
          printf 'DNSCRYPT_PROXY_TEST_BIN=%s/linux-x86_64/dnscrypt-proxy\n' "$preset_dir" >> "$GITHUB_ENV"
          printf 'DNSCRYPT_RESOLVER_CACHE=%s/cache\n' "$preset_dir" >> "$GITHUB_ENV"

      - name: Run real resolver preset tests
        if: matrix.shell_kind == 'dash'
        run: node tests/test-resolver-presets.js

      - name: Run WebUI bridge tests
        run: node tests/test-webui-bridge.js

      - name: Run v0.9.2 release contract
        run: node tests/test-v092-release.js

      - name: Verify generated WebUI is reproducible
        run: node webui/build.mjs --check

      - name: Run updater tests (${{ matrix.shell_kind }})
        env:
          TEST_SHELL_KIND: ${{ matrix.shell_kind }}
          DNSCRYPT_UPDATE_INTERVAL_SECONDS: "0"
        run: |
          case "$TEST_SHELL_KIND" in
            dash) dash tests/test-update-dnscrypt.sh ;;
            busybox-ash) busybox ash tests/test-update-dnscrypt.sh ;;
            mksh) mksh tests/test-update-dnscrypt.sh ;;
          esac

      - name: Run dnscrypt-control tests (${{ matrix.shell_kind }})
        env:
          TEST_SHELL_KIND: ${{ matrix.shell_kind }}
        run: |
          case "$TEST_SHELL_KIND" in
            dash) dash tests/test-dnscrypt-control.sh ;;
            busybox-ash) busybox ash tests/test-dnscrypt-control.sh ;;
            mksh) mksh tests/test-dnscrypt-control.sh ;;
          esac
