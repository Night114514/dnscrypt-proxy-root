name: Module Release

on:
  push:
    branches:
      - master
    paths:
      - module.prop
      - update.json
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: dnscrypt-proxy-root-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/test.yml

  release:
    if: needs.verify.result == 'success' && github.actor != 'github-actions[bot]'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release metadata
        id: version
        run: |
          TAG=$(sed -n 's/^version=//p' module.prop)

          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid module release tag: $TAG" >&2
            exit 1
          fi

          MODULE_VERSION=$(sed -n 's/^version=//p' module.prop)
          MODULE_CODE=$(sed -n 's/^versionCode=//p' module.prop)
          JSON_VERSION=$(jq -er '.version | select(type == "string")' update.json)
          JSON_CODE=$(jq -er '.versionCode | select(type == "number")' update.json)
          JSON_ZIP_URL=$(jq -er '.zipUrl | select(type == "string")' update.json)
          JSON_CHANGELOG=$(jq -er '.changelog | select(type == "string")' update.json)
          EXPECTED_ZIP_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/dnscrypt-proxy-root-$TAG.zip"
          EXPECTED_CHANGELOG="https://raw.githubusercontent.com/${{ github.repository }}/$TAG/CHANGELOG.md"

          [ "$TAG" = "$MODULE_VERSION" ] || {
            echo "Tag ($TAG) does not match module.prop ($MODULE_VERSION)." >&2
            exit 1
          }
          [ "$TAG" = "$JSON_VERSION" ] || {
            echo "Tag ($TAG) does not match update.json ($JSON_VERSION)." >&2
            exit 1
          }
          [ "$MODULE_CODE" = "$JSON_CODE" ] || {
            echo "versionCode mismatch: module.prop=$MODULE_CODE update.json=$JSON_CODE" >&2
            exit 1
          }
          [ "$JSON_ZIP_URL" = "$EXPECTED_ZIP_URL" ] || {
            echo "Unexpected update ZIP URL: $JSON_ZIP_URL" >&2
            exit 1
          }
          [ "$JSON_CHANGELOG" = "$EXPECTED_CHANGELOG" ] || {
            echo "Unexpected changelog URL: $JSON_CHANGELOG" >&2
            exit 1
          }
          [ -s CHANGELOG.md ] && grep -F "## $TAG " CHANGELOG.md >/dev/null || {
            echo "CHANGELOG.md has no entry for $TAG." >&2
            exit 1
          }

          UPSTREAM_VERSION=$(tr -d '[:space:]' < .github/upstream-version)
          if ! printf '%s\n' "$UPSTREAM_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid tracked upstream version: $UPSTREAM_VERSION" >&2
            exit 1
          fi

          RELEASE_SHA=$(git rev-parse HEAD)
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            TAG_SHA=$(git rev-parse "$TAG^{commit}")
            [ "$TAG_SHA" = "$RELEASE_SHA" ] || {
              echo "Release tag $TAG points to $TAG_SHA, not $RELEASE_SHA." >&2
              exit 1
            }
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "upstream=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_name=dnscrypt-proxy-root-$TAG.zip" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Validated module release $TAG (dnscrypt-proxy $UPSTREAM_VERSION)."

      - name: Build and inspect module ZIP
        env:
          ZIP_NAME: ${{ steps.version.outputs.zip_name }}
        run: |
          zip -r "$ZIP_NAME" \
            META-INF \
            config \
            scripts \
            webroot \
            action.sh \
            customize.sh \
            module.prop \
            post-fs-data.sh \
            service.sh \
            skip_mount \
            uninstall.sh \
            update.json

          unzip -t "$ZIP_NAME"
          if unzip -Z1 "$ZIP_NAME" | grep -Eq '(^|/)(\.git|\.github|tests|bin|run|logs|tmp)(/|$)|(^|/)README[^/]*$|(^|/)\.gitattributes$'; then
            echo 'Release ZIP contains a development-only path.' >&2
            exit 1
          fi
          unzip -Z1 "$ZIP_NAME"

      - name: Publish release tag
        id: publish
        env:
          RELEASE_SHA: ${{ steps.version.outputs.release_sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            TAG_SHA=$(git rev-parse "$TAG^{commit}")
            [ "$TAG_SHA" = "$RELEASE_SHA" ] || {
              echo "Release tag $TAG moved to $TAG_SHA." >&2
              exit 1
            }
          else
            git tag "$TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$TAG"
          fi
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Create module Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.publish.outputs.release_sha }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            ## Module release ${{ steps.version.outputs.tag }}

            - Module version: `${{ steps.version.outputs.tag }}`
            - Upstream dnscrypt-proxy: `${{ steps.version.outputs.upstream }}`

            The matching dnscrypt-proxy binary is downloaded during installation or on the next update check; it is not bundled in the module ZIP.

            See the [full module changelog](https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.version.outputs.tag }}/CHANGELOG.md).
          files: |
            ${{ steps.version.outputs.zip_name }}
            update.json
            CHANGELOG.md
          fail_on_unmatched_files: true
          make_latest: true
          draft: false
          prerelease: false
